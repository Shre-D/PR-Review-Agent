[project]
name = "pr-review-env"
version = "0.1.0"
description = "Multi-language OpenEnv benchmark for PR review tool routing"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Your Team"}]
license = {text = "BSD-3-Clause"}

dependencies = [
    "openenv-core",
    "fastmcp",
    "pydantic",
    "httpx",
]

[project.optional-dependencies]
server = [
    "pyyaml",
    "semgrep",
    "radon",
    "pylint",
    "fastapi",
    "uvicorn",
]
ui = [
    "gradio>=4.0",
]
train = [
    "trl",
    "peft",
    "bitsandbytes",
    "accelerate",
    "transformers",
    "datasets",
    "torch",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.setuptools]
packages = [
    "envs",
    "envs.pr_review_env",
    "envs.pr_review_env.client",
    "envs.pr_review_env.server",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
